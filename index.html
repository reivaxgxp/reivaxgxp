<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://unpkg.com/html5-qrcode"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  font-family: sans-serif;
  text-align: center;
  margin: 0;
  padding: 15px;
  background: #f0f2f5;
  transition: background 0.3s;
}

#reader {
  width: 100%;
  max-width: 320px;
  margin: 0 auto 10px auto;
}

button, input {
  padding: 14px;
  width: 100%;
  max-width: 400px;
  margin: 8px auto;
  display: block;
  font-size: 16px;
  border-radius: 10px;
  box-sizing: border-box;
}

button {
  border: none;
  background: #007bff;
  color: white;
}

#resultado {
  max-width: 400px;
  margin: 15px auto;
  padding: 15px;
  border-radius: 10px;
  font-size: 18px;
  font-weight: bold;
  min-height: 80px;
}
</style>
</head>

<body>

<h2>Validador de Ingresso</h2>

<div id="reader"></div>

<button onclick="start()">Ligar câmera</button>

<input type="text" id="codigoManual" placeholder="Digite o código">
<button onclick="validarManual()">Validar código</button>

<div id="resultado"></div>

<script>
const supabaseClient = supabase.createClient(
  "https://peslxjmstswbizwoqboz.supabase.co",
  "sb_publishable_VEFYgPA-X9q88s_0wtPWpw_Y97EGO_T"
);

const EVENTO_ID = "arraia2026";

let lendo = false;
let qr;
let audioCtx;

// Controle inteligente anti-duplicação
let ultimoCodigo = null;
let ultimoTempo = 0;
const TEMPO_BLOQUEIO = 4000;

// Inicializa áudio
function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
}

function beep(tipo) {
  if (!audioCtx) return;

  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.frequency.value = tipo === "ok" ? 800 : 200;

  osc.start();
  setTimeout(() => osc.stop(), 150);
}

function vibrar() {
  if (navigator.vibrate) navigator.vibrate(200);
}

function feedback(tipo, msg) {
  const res = document.getElementById("resultado");

  if (tipo === "sucesso") {
    document.body.style.background = "#28a745";
    res.style.color = "white";
    beep("ok");
  }

  if (tipo === "erro") {
    document.body.style.background = "#dc3545";
    res.style.color = "white";
    beep("erro");
  }

  if (tipo === "duplicado") {
    document.body.style.background = "#ffc107";
    res.style.color = "black";
    beep("erro");
  }

  vibrar();
  res.innerHTML = msg;

  setTimeout(() => {
    document.body.style.background = "#f0f2f5";
  }, 1500);
}

// Validação do código
async function validarCodigo(codigo) {
  lendo = true;

  try {
    const { data, error } = await supabaseClient
      .from('participantes')
      .select("nome, checkin")
      .eq("codigo", codigo)
      .eq("evento_id", EVENTO_ID)
      .maybeSingle();

    if (error) {
      console.error(error);
      feedback("erro", "Erro ao buscar no sistema");
      return;
    }

    if (!data) {
      feedback("erro", "Código não encontrado");
      return;
    }

    if (data.checkin) {

      // Garante que a data seja tratada como UTC corretamente
      let dataUTC = data.checkin;

      if (typeof dataUTC === "string" && !dataUTC.endsWith("Z")) {
        dataUTC = dataUTC.replace(" ", "T") + "Z";
      }

      // Converte para horário de São Paulo
      const dataFormatada = new Date(dataUTC).toLocaleString("pt-BR", {
        timeZone: "America/Sao_Paulo",
        day: "2-digit",
        month: "2-digit",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      });

      feedback(
        "duplicado",
        "Ingresso já utilizado<br><br>Nome: " + data.nome +
        "<br>Entrada: " + dataFormatada
      );
      return;
    }

    const { error: updateError } = await supabaseClient
      .from('participantes')
      .update({ checkin: new Date() })
      .eq("codigo", codigo)
      .eq("evento_id", EVENTO_ID);

    if (updateError) {
      feedback("erro", "Erro ao registrar check-in");
      return;
    }

    feedback("sucesso", "Acesso liberado<br>" + data.nome);

  } catch (e) {
    console.error(e);
    feedback("erro", "Erro inesperado");
  } finally {
    setTimeout(() => {
      lendo = false;
    }, 1500);
  }
}

// Inicializa a câmera e leitura contínua
function start() {
  initAudio();

  if (!qr) {
    qr = new Html5Qrcode("reader");
  }

  qr.start(
    { facingMode: "environment" },
    { 
      fps: 10, 
      qrbox: { width: 200, height: 200 } 
    },
    (text) => {
      const agora = Date.now();
      const codigo = text.trim();

      if (codigo === ultimoCodigo && (agora - ultimoTempo) < TEMPO_BLOQUEIO) {
        return;
      }

      if (lendo) return;

      ultimoCodigo = codigo;
      ultimoTempo = agora;

      validarCodigo(codigo);
    }
  );
}

// Validação manual via input
function validarManual() {
  initAudio();

  const codigo = document.getElementById("codigoManual").value;
  if (!codigo) return;

  validarCodigo(codigo.trim());
}
</script>

</body>
</html>
